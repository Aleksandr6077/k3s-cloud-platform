---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # Защита
spec:
  project: default
  source:
    repoURL: 'https://charts.longhorn.io/'
    targetRevision: 1.7.2  # Фиксируем версию чарта
    chart: longhorn
    helm:
      values: |
        persistence:
          defaultClassReplicaCount: 2
          allowVolumeCreationWithDegradedAvailability: true
        defaultSettings:
          defaultReplicaCount: 2
          upgradeChecker: false
        preUpgradeChecker:
          jobEnabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: longhorn-system # Автоматический деплой в изолированный namespace
    ignoreDifferences:
    # Игнорируем TLS-сертификат (caBundle), который контроллер Longhorn сам дописывает в вебхуки
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    # ДОБАВЛЕНО: игнорируем TLS-сертификат (caBundle), который longhorn-manager вписывает в 7 своих CRD при старте
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Включает применение правил ignoreDifferences при синхронизации
      - RespectIgnoreDifferences=true
      # Использует Server-Side Apply для корректной работы с большими CRD Longhorn
      - ServerSideApply=true
