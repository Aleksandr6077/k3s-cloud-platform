# ==============================================================================
# Loki — SingleBinary mode для эфемерного dev-стенда (весь Loki в 1 поде вместо 11, чтобы не душить 2 ноды в dev)
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1

  # Указываем S3
  storage:
    type: s3
    bucketNames:
      chunks: "${LOKI_BUCKET}"
      ruler: "${LOKI_BUCKET}"
      admin: "${LOKI_BUCKET}"
    s3:
      endpoint: "storage.yandexcloud.net"
      region: "ru-central1"
      s3ForcePathStyle: true
      insecure: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: index_
        object_store: s3
        store: tsdb
        schema: v13

  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: s3

  # Подтягиваем переменные окружения из нашего Secret
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials

# Отключаем MinIO (он больше не нужен)
minio:
  enabled: false

# конфигурация единственного пода Loki в режиме SingleBinary
singleBinary:
  replicas: 1
  # заставляет Loki подставить реальное имя бакета вместо "${LOKI_BUCKET}" из секрета
  extraArgs:
    - -config.expand-env=true
  # монтирует ключи S3 и имя бакета из K8s Secret, созданного ESO
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# явно обнуляем реплики микросервисов SimpleScalable, чтобы чарт их не создавал
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# лёгкий nginx-шлюз, чтобы не менять URL в values-alloy.yaml
gateway:
  enabled: true

# отключаем тяжёлые memcached-кэши и canary, они съедали ~1.5 ГБ RAM и CPU в dev
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
