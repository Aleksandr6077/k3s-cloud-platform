---
# ==============================================================================
# ЭТАП 0: Настройка локального окружения
# ==============================================================================
- name: Настройка локального хоста
  hosts: localhost
  gather_facts: true
  connection: local
  roles:
    - local_env

# ==============================================================================
# ЭТАП 1.5: Инициализация первого мастера K3s (Production-way: get_url + SHA256)
# ==============================================================================
- name: Инициализация первого мастера K3s
  hosts: k3s_masters[0]
  become: true
  gather_facts: false
  vars:
    k3s_version: "v1.37.2+k3s1"
    k3s_binary_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    k3s_sha256_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt"
  tasks:
    - name: "SRE-Guard: Ожидаем готовности SSH"
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        state: started
        delay: 5
        timeout: 120

    - name: Сбор фактов
      ansible.builtin.setup:

    - name: Установка ca-certificates
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: yes

    - name: Скачиваем файл с контрольной суммой SHA256
      ansible.builtin.get_url:
        url: "{{ k3s_sha256_url }}"
        dest: /tmp/k3s.sha256
        mode: '0644'

    - name: Извлекаем хеш из файла
      ansible.builtin.shell: grep ' k3s$' /tmp/k3s.sha256 | awk '{print $1}'
      register: k3s_sha256_hash

    - name: Скачиваем бинарник K3s с проверкой SHA256
      ansible.builtin.get_url:
        url: "{{ k3s_binary_url }}"
        dest: /usr/local/bin/k3s
        mode: "0755"
        checksum: "sha256:{{ k3s_sha256_hash.stdout }}"

    - name: Создаем симлинки для kubectl, crictl и ctr
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: "/usr/local/bin/{{ item }}"
        state: link
      loop:
        - kubectl
        - crictl
        - ctr

    - name: Создаем директорию конфигурации K3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Генерируем /etc/rancher/k3s/config.yaml для первого мастера
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          cluster-init: true
          node-ip: {{ ansible_default_ipv4.address }}
          tls-san:
            - 127.0.0.1
            - {{ ansible_default_ipv4.address }}
          disable:
            - servicelb
            - traefik
      notify: Restart k3s server

    - name: Создаем systemd-юнит k3s.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service
        mode: "0644"
        content: |
          [Unit]
          Description=Lightweight Kubernetes
          Documentation=https://k3s.io
          Wants=network-online.target
          After=network-online.target

          [Install]
          WantedBy=multi-user.target

          [Service]
          Type=notify
          KillMode=process
          Delegate=yes
          LimitNOFILE=1048576
          LimitNPROC=infinity
          LimitCORE=infinity
          TasksMax=infinity
          TimeoutStartSec=0
          Restart=always
          RestartSec=5s
          ExecStartPre=/sbin/modprobe br_netfilter
          ExecStartPre=/sbin/modprobe overlay
          ExecStart=/usr/local/bin/k3s server
      notify: Restart k3s server

    - name: Запускаем и включаем сервис k3s
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Ожидаем готовности Kubernetes API (порт 6443)
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 6443
        state: started
        timeout: 120

    - name: Считываем node-token с первого мастера
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_raw
      no_log: true

    - name: Сохраняем токен и IP первого мастера как факты
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
        k3s_master_ip: "{{ ansible_default_ipv4.address }}"
      no_log: true

  handlers:
    - name: Restart k3s server
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true

# ==============================================================================
# ЭТАП 1.6: Подключение остальных мастеров (в dev автоматически пропустится)
