# ==============================================================================
# ЭТАП 2: Kubeconfig
# ==============================================================================
- name: Экспорт доступов из кластера K3s
  hosts: k3s_masters
  gather_facts: false
  roles:
    - k3s_kubeconfig

# ==============================================================================
# ЭТАП 3: ArgoCD + ESO Auth Secret + Root App
# ==============================================================================
- name: Подготовка GitOps-оператора в Kubernetes
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml
  tasks:
    - name: Создание пространства имен для ArgoCD
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../.kube/config"
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: Установка ArgoCD из официального манифеста (v3.5.1)
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../.kube/config"
        state: present
        src: "https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/install.yaml"
        namespace: argocd
        apply: true
        server_side_apply:
          field_manager: ansible

    - name: Ожидание полной готовности ArgoCD Server
      kubernetes.core.k8s_info:
        kubeconfig: "{{ playbook_dir }}/../.kube/config"
        kind: Deployment
        name: argocd-server
        namespace: argocd
      register: argocd_status
      until: argocd_status.resources[0].status.readyReplicas | default(0) > 0
      retries: 30
      delay: 10

    - name: Создание namespace для ESO
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../.kube/config"
        name: external-secrets
        api_version: v1
        kind: Namespace
        state: present

    - name: Создание Secret с авторизованным ключом для ESO
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../.kube/config"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: yc-auth
            namespace: external-secrets
          type: Opaque
          stringData:
            authorized-key: "{{ lookup('file', eso_authorized_key_file) | string }}"
      no_log: true

    - name: Деплой Root App (App of Apps)
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../.kube/config"
        state: present
        src: "{{ playbook_dir }}/../k8s/argocd/root-app.yaml"
