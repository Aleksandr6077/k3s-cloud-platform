    k3s_sha256_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt"
    first_master: "{{ groups['k3s_masters'][0] }}"
  tasks:
    - name: "SRE-Guard: Ожидаем готовности SSH"
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        state: started
        delay: 5
        timeout: 120

    - name: Сбор фактов
      ansible.builtin.setup:

    - name: Установка ca-certificates
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: yes

    - name: Скачиваем файл с контрольной суммой SHA256
      ansible.builtin.get_url:
        url: "{{ k3s_sha256_url }}"
        dest: /tmp/k3s.sha256
        mode: '0644'

    - name: Извлекаем хеш из файла
      ansible.builtin.shell: grep ' k3s$' /tmp/k3s.sha256 | awk '{print $1}'
      register: k3s_sha256_hash

    - name: Скачиваем бинарник K3s с проверкой SHA256
      ansible.builtin.get_url:
        url: "{{ k3s_binary_url }}"
        dest: /usr/local/bin/k3s
        mode: "0755"
        checksum: "sha256:{{ k3s_sha256_hash.stdout }}"

    - name: Создаем симлинки для kubectl, crictl и ctr
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: "/usr/local/bin/{{ item }}"
        state: link
      loop:
        - kubectl
        - crictl
        - ctr

    - name: Создаем директорию конфигурации K3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Генерируем /etc/rancher/k3s/config.yaml для дополнительного мастера
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        no_log: true
        content: |
          server: https://{{ hostvars[first_master]['k3s_master_ip'] }}:6443
          token: {{ hostvars[first_master]['k3s_token'] }}
          node-ip: {{ ansible_default_ipv4.address }}
          tls-san:
            - 127.0.0.1
            - {{ ansible_default_ipv4.address }}
          disable:
            - servicelb
            - traefik

    - name: Создаем systemd-юнит k3s.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service
        mode: "0644"
        content: |
          [Unit]
          Description=Lightweight Kubernetes
          Documentation=https://k3s.io
          Wants=network-online.target
          After=network-online.target

          [Install]
          WantedBy=multi-user.target

          [Service]
          Type=notify
          KillMode=process
          Delegate=yes
          LimitNOFILE=1048576
          LimitNPROC=infinity
          LimitCORE=infinity
          TasksMax=infinity
          TimeoutStartSec=0
          Restart=always
          RestartSec=5s
          ExecStartPre=/sbin/modprobe br_netfilter
          ExecStartPre=/sbin/modprobe overlay
          ExecStart=/usr/local/bin/k3s server

    - name: Запускаем и включаем сервис k3s
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Ожидаем готовности порта 6443 на подключенном мастере
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 6443
        state: started
        timeout: 120

